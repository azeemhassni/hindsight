name: hindsight-testenv

services:
  sshd:
    build: ./sshd
    # Survives a Docker engine restart. Without this the containers stay down
    # and the integration tests quietly skip, which looks like a pass.
    restart: unless-stopped
    environment:
      HINDSIGHT_TEST_PUBKEY: ${HINDSIGHT_TEST_PUBKEY:?run scripts/testenv.sh up}
    ports:
      - "127.0.0.1:2222:22"
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -ltn | grep -q ':22'"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: pg-test-pw-8f2a
      POSTGRES_USER: hindsight
      POSTGRES_DB: hindsight_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: my-test-pw-3c7d
      MYSQL_DATABASE: hindsight_test
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-pmy-test-pw-3c7d"]
      interval: 3s
      timeout: 3s
      retries: 30
